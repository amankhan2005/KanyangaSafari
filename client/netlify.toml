# Netlify deploys the React frontend only (client/, Vite). The Express API (server/) is deployed separately
# to a Node host; see README → Deployment.
#
# The repository is an npm-workspaces monorepo with one lockfile at the root, so Netlify installs from the
# root and builds just the client workspace.

[build]
  command = "npm run build -w client"
  publish = "client/dist"

[build.environment]
  NODE_VERSION = "20"
  # Set VITE_API_URL in the Netlify UI (Site configuration → Environment variables) to the API's public URL,
  # e.g. https://api.kanyangasafari.com — or leave it empty and enable the /api proxy below.

# Optional: proxy /api to the Express server so the browser stays on one origin (no CORS, VITE_API_URL empty).
# Replace the host, uncomment, and keep it ABOVE the SPA fallback.
# [[redirects]]
#   from = "/api/*"
#   to = "https://YOUR-API-HOST/api/:splat"
#   status = 200
#   force = true

# Single-page app fallback: /about, /services, /gallery, /contact, /travel-proposal, /itinerary, /eta and
# any other client-side route are served index.html. Real files (assets, images, hero.mp4) are served first.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Vite fingerprints everything in /assets, so it can be cached forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/hero.mp4"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
